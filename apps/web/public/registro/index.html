<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta | GESTOR</title>

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card shadow-lg border-0 w-100" style="max-width: 440px;">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="fw-bold">GESTOR</h1>
          <p class="text-secondary mb-0">Crea tu cuenta de delegado</p>
        </div>

        <div id="registroError"
             class="alert alert-danger d-none"
             role="alert"></div>

        <div id="registroExito"
             class="alert alert-success d-none"
             role="status"></div>

        <form id="registroForm">
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre completo</label>
            <input
              type="text"
              class="form-control"
              id="nombre"
              autocomplete="name"
              required
            >
          </div>

          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              autocomplete="email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="contrasena"
              minlength="10"
              autocomplete="new-password"
              required
            >
            <div class="form-text">
              La contraseña debe tener al menos 10 caracteres.
            </div>
          </div>

          <div class="mb-4 form-check">
            <input
              type="checkbox"
              class="form-check-input"
              id="aceptaPolitica"
              required
            >
            <label class="form-check-label" for="aceptaPolitica">
              Acepto la política de privacidad.
            </label>
          </div>

          <button
            id="registroButton"
            type="submit"
            class="btn btn-primary w-100"
          >
            Crear cuenta
          </button>
        </form>

        <p class="text-center mt-4 mb-0">
          ¿Ya tienes cuenta?
          <a href="../login/">Iniciar sesión</a>
        </p>
      </div>
    </section>
  </main>

  <script src="registro.js"></script>
</body>
</html>
