<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061629">
  <title>Restablecer contraseña | GESTOR</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-compact-page">
  <main class="auth-compact-layout">
    <section class="auth-compact-card">
      <div class="auth-compact-header">
        <div class="auth-logo-wrap">
          <img src="../assets/logo-gestor.png" alt="Logo de GESTOR">
        </div>
        <p class="auth-eyebrow">NUEVA CONTRASEÑA</p>
        <h1>Restablecer contraseña</h1>
        <p class="auth-subtitle">Introduce tu nueva contraseña para continuar.</p>
      </div>

      <div id="resetError" class="auth-alert auth-alert-error d-none" role="alert" aria-live="polite"></div>
      <div id="resetExito" class="auth-alert auth-alert-success d-none" role="status" aria-live="polite"></div>

      <form id="resetForm" class="auth-form">
        <div class="auth-field-group">
          <label for="contrasena">Nueva contraseña</label>
          <div class="auth-input-shell">
            <span class="auth-input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
            </span>
            <input type="password" id="contrasena" name="contrasena" minLength="10" autocomplete="new-password" placeholder="Mínimo 10 caracteres" required>
          </div>
        </div>

        <div class="auth-field-group">
          <label for="contrasena2">Repetir contraseña</label>
          <div class="auth-input-shell">
            <span class="auth-input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
              </svg>
            </span>
            <input type="password" id="contrasena2" name="contrasena2" minLength="10" autocomplete="new-password" placeholder="Repite la contraseña" required>
          </div>
        </div>

        <button id="resetButton" type="submit" class="auth-submit">
          <span>Cambiar contraseña</span>
        </button>
      </form>

      <div class="auth-links">
        <a href="../login/">Volver a iniciar sesión</a>
      </div>
    </section>
  </main>
  <script src="reset-password.js"></script>
</body>
</html>
