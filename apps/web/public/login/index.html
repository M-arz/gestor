
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | GESTOR</title>

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <section class="card shadow-lg border-0 w-100" style="max-width: 440px;">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 class="fw-bold">GESTOR</h1>
          <p class="text-secondary mb-0">Accede a tu panel de gestión</p>
        </div>

        <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input
              type="email"
              class="form-control"
              id="correo"
              autocomplete="email"
              required
            >
          </div>

          <div class="mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input
              type="password"
              class="form-control"
              id="contrasena"
              autocomplete="current-password"
              required
            >
          </div>

          <button id="loginButton" type="submit" class="btn btn-primary w-100">
            Iniciar sesión
          </button>
        </form>

        <p class="text-center mt-4 mb-0">
          ¿No tienes cuenta?
          <a href="../registro/">Crear una cuenta</a>
        </p>
      </div>
    </section>
  </main>

  <script src="login.js"></script>
</body>
</html>
