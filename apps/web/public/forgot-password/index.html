<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061629">
  <title>Recuperar contraseña | GESTOR</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body class="auth-compact-page">
  <main class="auth-compact-layout">
    <section class="auth-compact-card">
      <div class="auth-compact-header">
        <div class="auth-logo-wrap">
          <img src="../assets/logo-gestor.png" alt="Logo de GESTOR">
        </div>
        <p class="auth-eyebrow">RECUPERAR ACCESO</p>
        <h1>Recuperar contraseña</h1>
        <p class="auth-subtitle">Introduce tu correo para recibir el enlace de recuperación.</p>
      </div>

      <div id="forgotError" class="auth-alert auth-alert-error d-none" role="alert" aria-live="polite"></div>
      <div id="forgotExito" class="auth-alert auth-alert-success d-none" role="status" aria-live="polite"></div>

      <form id="forgotForm" class="auth-form">
        <div class="auth-field-group">
          <label for="correo">Correo electrónico</label>
          <div class="auth-input-shell">
            <span class="auth-input-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="3" y="5" width="18" height="14" rx="3"></rect>
                <path d="m4 7 8 6 8-6"></path>
              </svg>
            </span>
            <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" required>
          </div>
        </div>

        <button id="forgotButton" type="submit" class="auth-submit">
          <span>Enviar enlace</span>
        </button>
      </form>

      <div class="auth-links">
        <a href="../login/">Volver a iniciar sesión</a>
      </div>
    </section>
  </main>
  <script src="forgot-password.js"></script>
</body>
</html>
